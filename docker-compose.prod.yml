services:

  nginx_api:
    container_name: nginx_api_${PROJECT_NAME}
    image: nginx:1.23-alpine
    restart: unless-stopped
    environment:
      PHP_HOST: php_${PROJECT_NAME}
    volumes:
      - ./symfony-app:/var/www/html
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - php
    networks:
      - app

  php:
    container_name: php_${PROJECT_NAME}
    build:
      context: ./docker/php
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      PROJECT_NAME: ${PROJECT_NAME}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
#      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      WEEKLY_REPORT_EMAIL: ${WEEKLY_REPORT_EMAIL}
    volumes:
      - ./symfony-app:/var/www/html
      - ./logs/symfony:/var/www/html/var/log
      - ./caches/symfony:/var/www/html/var/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  cron:
    container_name: cron_${PROJECT_NAME}
    build:
      context: ./docker/php
    restart: unless-stopped
    command: ["supercronic", "-passthrough-logs", "/etc/cron/crontab"]
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      PROJECT_NAME: ${PROJECT_NAME}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
#      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
#      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
#      VAPID_SUBJECT: ${VAPID_SUBJECT}
      WEEKLY_REPORT_EMAIL: ${WEEKLY_REPORT_EMAIL}
    volumes:
      - ./symfony-app:/var/www/html
      - ./docker/cron/crontab:/etc/cron/crontab:ro
      - ./logs/symfony:/var/www/html/var/log
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  mysql:
    container_name: mysql_${PROJECT_NAME}
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${PROJECT_DBNAME}
      MYSQL_USER: ${PROJECT_DBNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./datas/mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    container_name: phpmyadmin_${PROJECT_NAME}
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql_${PROJECT_NAME}
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  frontend:
    container_name: frontend_${PROJECT_NAME}
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - nginx_api
    networks:
      - app

networks:
  app:
    driver: bridge
